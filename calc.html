<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
</head>
<body>
    <form>
        <input type="number" id="num1" placeholder="First number"><br><br>
        <input type="number" id="num2" placeholder="Second number"><br><br>
        
        <button type="button" id="btnAdd">Add</button>
        <button type="button" id="btnSubtract">Subtract</button>
        <button type="button" id="btnMultiply">Multiply</button>
        <button type="button" id="btnDivide">Divide</button>
    </form>
    
    <h2 id="result"></h2>

    <script src="calc.js"></script>
</body>
</html>
